[workspace]
members = ["crates/quota-core"]
resolver = "2"

[package]
name = "formal-cloud"
version = "0.1.0"
edition = "2021"
default-run = "server"

[dependencies]
quota-core = { path = "crates/quota-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"

